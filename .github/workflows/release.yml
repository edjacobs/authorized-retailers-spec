name: Release

# Push a tag like v0.1.0 (matching package.json) to publish to npm. Uses npm trusted
# publishing (OIDC): configure it for this repo and workflow on npmjs.com; no token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm publish # access and provenance come from publishConfig
